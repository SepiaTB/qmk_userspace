name: Build QMK firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: bastardkb/bastardkb-qmk
      # Commit fijo de la rama bkb-master-archive de BastardKB (congelada desde 2025-08-10). Con el SHA el CI no depende del nombre de la rama.
      qmk_ref: 8f3b92fff27e6356120913a4ec6b21a017d0fef6

  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    if: always() && !cancelled()
    needs: build
